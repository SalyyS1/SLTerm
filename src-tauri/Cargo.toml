[package]
name = "slterm"
version = "0.20.0"
description = "Open-Source Modern Terminal by Salyvn"
edition = "2021"
rust-version = "1.82"

[lib]
name = "slterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
# Only for the "user@host" string the UI shows. Reading HOSTNAME from the
# environment is unreliable on macOS and in non-interactive shells.
hostname = "0.4"
# Focus the running window instead of letting a second launch race the first for
# the data-dir lock. Registered before every other plugin, which the plugin
# requires. Desktop only — there is no second instance to detect on mobile.
tauri-plugin-single-instance = "2"
# Startup failures have to be visible: without a dialog the process printed to a
# stderr nobody reads and vanished.
tauri-plugin-dialog = "2"

[target.'cfg(windows)'.dependencies]
# One call: DwmSetWindowAttribute for rounded corners on the undecorated window.
# Undecorated windows lose DWM's rounding, and there is no Tauri API for it.
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_Shell"] }

[profile.release]
# The whole point of moving off Electron is size, so optimize for it: fat LTO
# and one codegen unit let the linker drop far more, panic=abort removes the
# unwinding tables, and strip discards symbols.
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

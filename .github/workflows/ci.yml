name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GO_VERSION: "1.25.6"
  NODE_VERSION: "22"
  GOTOOLCHAIN: local

jobs:
  go-backend-tests:
    name: Go Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - name: Run Go core package tests
        run: |
          go test -race -v \
            ./pkg/adestats/... \
            ./pkg/adeworkspace/... \
            ./pkg/agentteams/... \
            ./pkg/agentsessions/... \
            ./pkg/agentwatch/... \
            ./pkg/aitools/... \
            ./pkg/nltcmd/... \
            ./pkg/otelcost/... \
            ./pkg/portwatch/... \
            ./pkg/projectdetect/... \
            ./pkg/taskboard/... \
            ./pkg/updatecheck/... \
            ./pkg/vcs/... \
            ./pkg/secretstore/... \
            ./pkg/sshaudit/... \
            ./cmd/sshaudit/... \
            ./pkg/cmdguard/... \
            ./cmd/cmdguard/... \
            ./pkg/authkey/... \
            ./pkg/remote/connparse/... \
            ./pkg/web/...

  frontend-terminal-tests:
    name: Frontend Terminal Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install frontend dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Repair Linux optional native binaries
        run: node scripts/repair-native-deps.mjs
      - name: Run Vitest terminal test suite
        run: npx vitest run frontend/app/view/term/tests/

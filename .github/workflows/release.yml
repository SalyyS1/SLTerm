# Builds installers for every supported platform on a tag and attaches them to a
# GitHub Release.
#
# This replaces the inherited Wave Terminal pipeline, which built into a private
# S3 staging bucket and then published from it. That needed AWS credentials and
# Apple signing certificates belonging to upstream's infrastructure, so it could
# never run in this fork. Everything here uses GitHub's own runners and
# GITHUB_TOKEN.
#
# Each runner builds its own platform natively, because wavesrv is a CGO build
# (sqlite) and cannot be cross-compiled without a target C toolchain. The one
# exception is Windows, which cross-compiles with zig — the path the Taskfile
# already used.

name: Release

run-name: Release ${{ github.ref_name }}

on:
    push:
        tags:
            - "v[0-9]+.[0-9]+.[0-9]+*"
    workflow_dispatch:

permissions:
    contents: write

env:
    GO_VERSION: "1.25.6"
    NODE_VERSION: "22"
    GOTOOLCHAIN: local

jobs:
    build:
        name: Build ${{ matrix.label }}
        runs-on: ${{ matrix.runner }}
        strategy:
            # Keep going so one platform failing still produces the others'
            # installers rather than an empty release.
            fail-fast: false
            matrix:
                include:
                    - label: windows-x64
                      runner: windows-latest
                    - label: macos-arm64
                      runner: macos-latest
                    - label: macos-x64
                      runner: macos-13
                    - label: linux-x64
                      runner: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - uses: actions/setup-go@v6
              with:
                  go-version: ${{ env.GO_VERSION }}
                  cache-dependency-path: go.sum

            - uses: actions/setup-node@v6
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
                  cache-dependency-path: package-lock.json

            # Windows needs a C cross-compiler for the CGO sqlite build.
            - name: Install Zig
              if: runner.os == 'Windows'
              uses: mlugg/setup-zig@v2
              with:
                  version: 0.14.0

            # electron-builder's bundled fpm cannot build deb on newer runners.
            - name: Install fpm
              if: runner.os == 'Linux'
              run: sudo gem install fpm --no-document

            - name: Install Task
              uses: arduino/setup-task@v2
              with:
                  version: 3.x
                  repo-token: ${{ secrets.GITHUB_TOKEN }}

            - uses: nick-fields/retry@v3
              name: npm ci
              with:
                  command: npm ci --no-audit --no-fund
                  retry_on: error
                  max_attempts: 3
                  timeout_minutes: 10

            - name: Package
              run: task package
              env:
                  # Signing is opt-in: these are unset unless the repo defines
                  # them, and electron-builder falls back to unsigned builds.
                  CSC_LINK: ${{ secrets.MACOS_CERTIFICATE }}
                  CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
                  SM_CODE_SIGNING_CERT_SHA1_HASH: ${{ secrets.SM_CODE_SIGNING_CERT_SHA1_HASH }}

            - name: Collect installers
              shell: bash
              run: |
                  mkdir -p artifacts
                  # Only the distributable installers and the updater manifests;
                  # skip unpacked app trees and builder debug output.
                  find release -maxdepth 1 -type f \
                      \( -name '*.exe' -o -name '*.zip' -o -name '*.dmg' \
                         -o -name '*.AppImage' -o -name '*.deb' \
                         -o -name '*.blockmap' -o -name 'latest*.yml' \) \
                      -exec cp {} artifacts/ \;
                  ls -la artifacts

            - uses: actions/upload-artifact@v5
              with:
                  name: installers-${{ matrix.label }}
                  path: artifacts/
                  if-no-files-found: error
                  retention-days: 7

    release:
        name: Publish Release
        needs: build
        runs-on: ubuntu-latest
        # Only publish for a real tag; workflow_dispatch runs are build-only so
        # the pipeline can be exercised without cutting a release.
        if: startsWith(github.ref, 'refs/tags/v')
        steps:
            - uses: actions/download-artifact@v6
              with:
                  path: staging
                  pattern: installers-*
                  merge-multiple: true

            - name: List what will be published
              run: ls -la staging

            - name: Create or update the release
              uses: softprops/action-gh-release@v2
              with:
                  files: staging/*
                  draft: false
                  generate_release_notes: true
                  fail_on_unmatched_files: true
